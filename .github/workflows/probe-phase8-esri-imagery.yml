name: Probe Phase 8 Esri Damavand Imagery

on:
  workflow_dispatch:
  push:
    branches:
      - phase8-digital-twin-build
    paths:
      - "scripts/digital_twin/probe_esri_world_imagery.py"
      - ".github/workflows/probe-phase8-esri-imagery.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe Esri World Imagery metadata
        run: |
          python scripts/digital_twin/probe_esri_world_imagery.py \
            --output .cache/digital-twin/esri-world-imagery.json

      - name: Upload source report
        uses: actions/upload-artifact@v4
        with:
          name: phase8-esri-world-imagery-report
          path: .cache/digital-twin/esri-world-imagery.json
          if-no-files-found: error
