name: Iranian UX Validation

on:
  push:
    branches:
      - iranian-ux
    paths:
      - package.json
      - src/**
      - index.html
      - public/favicon.svg
      - IRANIAN_DESIGN_SYSTEM.md
      - .github/workflows/iranian-ux-ci.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iranian-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile for self-hosted font
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Publish lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git commit -m "build(design): lock Estedad self-hosted font"
          git push origin HEAD:iranian-ux
