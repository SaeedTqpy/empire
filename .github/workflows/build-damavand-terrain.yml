name: Validate Damavand Terrain

on:
  workflow_dispatch:
  push:
    branches:
      - iran-peaks
    paths:
      - "scripts/terrain/**"
      - ".github/workflows/build-damavand-terrain.yml"

permissions:
  contents: read

concurrency:
  group: damavand-terrain-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-terrain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: iran-peaks

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/terrain/requirements.txt

      - name: Cache source DEM tiles
        uses: actions/cache@v4
        with:
          path: .terrain-cache
          key: damavand-skadi-${{ runner.os }}-${{ hashFiles('scripts/terrain/damavand.json') }}
          restore-keys: |
            damavand-skadi-${{ runner.os }}-

      - name: Install terrain dependencies
        run: pip install -r scripts/terrain/requirements.txt

      - name: Prefetch source DEM tiles
        run: |
          python scripts/terrain/prefetch_tiles.py \
            --config scripts/terrain/damavand.json \
            --cache-dir .terrain-cache \
            --workers 4

      - name: Build validation terrain
        run: |
          mkdir -p .cache/terrain
          python scripts/terrain/build_peak_terrain.py \
            --config scripts/terrain/damavand.json \
            --output .cache/terrain/damavand.raw.glb \
            --manifest .cache/terrain/damavand.terrain.json \
            --cache-dir .terrain-cache

      - name: Validate terrain geometry
        run: |
          python scripts/terrain/validate_terrain.py \
            --model .cache/terrain/damavand.raw.glb \
            --manifest .cache/terrain/damavand.terrain.json

      - name: Report validation model
        run: ls -lh .cache/terrain/damavand.raw.glb .cache/terrain/damavand.terrain.json

      # Canonical /public assets are intentionally NOT published here.
      # The imagery workflow owns the final textured GLB + matching terrain
      # manifest so a terrain-only job can never overwrite satellite material.
